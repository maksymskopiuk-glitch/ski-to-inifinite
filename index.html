function drawBackground(time,isMenu){const g=ctx;const sky=g.createLinearGradient(0,0,0,200);sky.addColorStop(0,'#374260');sky.addColorStop(.37,'#8c7291');sky.addColorStop(.7,'#d49b9b');sky.addColorStop(1,'#f4c6a3');g.fillStyle=sky;g.fillRect(0,0,480,270);for(const st of stars)rect(g,st.x,st.y,st.size,1,'#e3cdda66');for(let i=0;i<13;i++){const sy=57+i*5,sw=Math.sqrt(Math.max(0,34*34-(sy-89)*(sy-89)))*2;rect(g,349-sw/2,sy,sw,4,i<6?'#fbd39e':'#f2b793')}for(let i=0;i<6;i++){const x=((i*117+time*1.4)%620)-70,y=40+(i*31)%71;rect(g,x,y,44+i*3,2,'#e9babb44');rect(g,x+12,y-3,27,3,'#e9babb33')}const par=isMenu?Math.sin(time/18)*6:world*.025;mountain(35-par,100,108,87,'#828caa','#b9bfd1');mountain(140-par,73,113,121,'#9299b3','#d7d6df');mountain(274-par,112,110,87,'#919ab1','#ddd8df');mountain(426-par,94,102,103,'#8691ad','#c7cbd9');mountain(546-par,103,105,100,'#858faa','#cbd0dc');poly(g,[[0,188],[34,163],[80,177],[154,139],[189,148],[237,193],[290,162],[334,171],[402,141],[480,168],[480,270],[0,270]],'#8aa4bd');poly(g,[[0,188],[34,163],[80,177],[154,139],[189,148],[237,193],[185,172],[166,153],[139,162],[103,184],[65,184],[31,179]],'#e5e4e8');poly(g,[[254,185],[290,162],[334,171],[402,141],[480,168],[480,187],[427,163],[402,151],[344,187],[293,177]],'#dce4e9');for(let i=0;i<40;i++){const x=((i*23-world*.08)%530+530)%530-25,y=186+7*Math.sin(i*1.7);pine(g,x,y,.28+(i%3)*.05,'#687f99')}

g.strokeStyle='#586782';g.lineWidth=1;g.beginPath();g.moveTo(293,115);g.lineTo(480,135);g.stroke();for(const x of [304,451]){const yy=115+(x-293)*.107;rect(g,x,yy,2,40,'#687a94');rect(g,x-4,yy-2,10,2,'#687a94')}for(let i=0;i<4;i++){const x=295+((time*4+i*49)%187),y=115+(x-293)*.107;rect(g,x,y,1,6,'#4d5d79');rect(g,x-3,y+6,8,7,'#bd797b');rect(g,x-2,y+7,6,3,'#a7c9d5');rect(g,x-1,y+13,4,1,'#4d5d79')}
if(isMenu){poly(g,[[0,226],[64,229],[142,209],[199,221],[265,185],[305,183],[363,208],[430,186],[480,198],[480,270],[0,270]],'#e3eaf0');poly(g,[[0,245],[91,247],[196,228],[255,235],[322,219],[405,239],[480,220],[480,270],[0,270]],'#c1d5e2');for(let i=0;i<5;i++){const x=225+((time*(11+i*2)+i*57)%305),base=186+15*Math.sin((x-280)/48),jump=Math.max(0,Math.sin((time+i*2)*1.5))*17;g.save();g.translate(x,base-jump);g.scale(.43,.43);const angle=jump>9?(time*3+i)%6.28:.12;drawRider(g,0,0,RIDERS[i],GEARS[i%2?4:0],angle);g.restore()}pine(g,430,223,1.5,'#4c6b82',true);pine(g,454,239,2,'#3c5d77',true);pine(g,407,221,.9,'#5a7990',true);for(let i=0;i<13;i++)rect(g,230+i*22,245+(i*17)%21,4,1,'#9bbace');const y=233+Math.sin(time*1.8)*2;g.save();g.translate(346,y);g.scale(1.7,1.7);drawRider(g,0,0,currentRider(),currentGear(),-.14);g.restore();for(let i=0;i<8;i++)rect(g,311-i*6-(time*14)%6,y+4+(i%3),3,1,'#f3f4ec');poly(g,[[0,261],[90,257],[150,266],[221,263],[320,265],[392,254],[480,265],[480,270],[0,270]],'#8cacbd');pine(g,478,270,2.4,'#294b66');} }
function drawTerrain(){const p=[[0,300]];for(let sx=-2;sx<=482;sx+=2)p.push([sx,terrain(world+sx)]);p.push([482,300]);poly(ctx,p,'#dfedf0');const p2=[[0,300]];for(let sx=-2;sx<=482;sx+=3)p2.push([sx,terrain(world+sx)+7]);p2.push([482,300]);poly(ctx,p2,'#bdd5e0');for(let i=0;i<25;i++){const wx=Math.floor(world/24)*24+i*24,x=wx-world;rect(ctx,x,terrain(wx)+14+(i%3)*8,5+(i%3)*3,1,'#8eafc655')}for(let i=0;i<9;i++){const wx=Math.floor((world*.35)/68)*68+i*68,x=wx-world*.35;pine(ctx,x,terrain(world+x)-12,.5+(i%3)*.17,'#668c9f',true)}}
function drawEntity(e){const x=e.x-world,y=terrain(e.x);if(e.type==='coin'){const cy=y-e.height,w=3+Math.abs(Math.sin(ambient*5+e.x)) *3;rect(ctx,x-w/2,cy-5,w,10,'#c38a4e');rect(ctx,x-w/2-1,cy-3,w+2,6,'#f7c66c');rect(ctx,x-w/2,cy-3,1,5,'#fff0b7');return}if(e.type==='rock'){poly(ctx,[[x-10,y],[x-11,y-7],[x-6,y-16],[x+3,y-19],[x+10,y-11],[x+12,y]],'#657992');poly(ctx,[[x-11,y-7],[x-6,y-16],[x+3,y-19],[x+10,y-11],[x+3,y-12],[x-2,y-10]],'#f3f2ed');rect(ctx,x+3,y-8,3,6,'#50657d')}if(e.type==='log'){rect(ctx,x-13,y-10,26,10,'#946950');rect(ctx,x-13,y-12,26,4,'#f2eee5');rect(ctx,x+8,y-8,5,6,'#c69568');rect(ctx,x-7,y-6,11,1,'#bd8b64')}if(e.type==='rider')drawRider(ctx,x,y,RIDERS[e.rider],GEARS[e.rider%2?4:0],Math.atan(slope(e.x)),1);if(e.type==='ramp'){poly(ctx,[[x-18,y],[x+14,y-17],[x+14,y]],'#84adbf');poly(ctx,[[x-19,y-1],[x+14,y-19],[x+17,y-17],[x-15,y]],'#f8f4e9');rect(ctx,x+15,y-32,1,15,'#637c96');rect(ctx,x+16,y-32,10,5,'#d8907e')}}
function startRun(){closeModal();resetJumpInput();mode='playing';setMenuVisible(false);world=0;elapsed=0;score=0;runCoins=0;runSaved=false;speed=78;spawnAt=420;entities=[];particles=[];jumpBuffer=0;deathDelay=0;Object.assign(player,{y:terrain(player.x),vy:0,grounded:true,air:0,angle:0});for(let i=0;i<7;i++)entities.push({type:'coin',x:175+i*22,height:15});$('score').textContent='0';$('run-coins').textContent='0';$('speed').textContent='1.0×';unlockAudio();$('scene').setAttribute('tabindex','0');$('scene').focus({preventScroll:true})}
function saveRun(){if(runSaved)return;runSaved=true;const old=save.best;save.coins+=runCoins;save.best=Math.max(save.best,Math.floor(score));persist();updateWallet();$('new-best').hidden=save.best<=old}
function endRun(){if(mode!=='playing')return;resetJumpInput();mode='crashed';deathDelay=.7;sfx('crash');for(let i=0;i<24;i++)particles.push({x:world+player.x,y:player.y-8,vx:(Math.random()-.5)*90,vy:-Math.random()*100,life:.5+Math.random()*.4,color:i%3?'#eaf5f5':'#eac39c'});saveRun()}
function showResults(){mode='gameover';$('result-score').textContent=fmt(score);$('result-best').textContent=fmt(save.best);$('result-coins').textContent=fmt(runCoins);openModal('gameover')}
function goMenu(){if(mode==='playing'||mode==='paused')saveRun();resetJumpInput();closeModal();mode='menu';setMenuVisible(true);updateWallet();$('play').focus()}
function pauseRun(){if(mode!=='playing')return;mode='paused';resetJumpInput();openModal('paused')}
function resumeRun(){if(mode!=='paused')return;resetJumpInput();closeModal();mode='playing';last=performance.now();$('scene').focus({preventScroll:true})}
function requestJump(){if(mode!=='playing')return;unlockAudio();jumpBuffer=.14}
function doJump(boost=1){player.vy=-JUMP.speed*boost;player.grounded=false;player.air=0;player.holdTime=0;player.holdActive=jumpInputs.size>0;jumpBuffer=0;sfx('jump');for(let i=0;i<6;i++)particles.push({x:world+player.x-7,y:player.y,vx:-25-Math.random()*25,vy:-Math.random()*30,life:.4,color:'#f2f5ef'})}
function spawnGroup(){const x=spawnAt;const number=Math.floor(x/190);const type=['rock','log','rider','rock','rider'][number%5];entities.push({type,x,height:type==='rider'?26:19,rider:number%RIDERS.length});const approach=70;for(let i=0;i<6;i++)entities.push({type:'coin',x:x-approach+i*26,height:27+Math.sin(i/5*Math.PI)*46});if(number%4===2&&type!=='rider')entities.push({type:'ramp',x:x-Math.max(44,speed*.55),used:false});spawnAt+=Math.max(195,speed*1.8)+(type==="rider"?170:0)+Math.random()*65}
function update(dt){ambient+=dt;musicTick(ambient);if(mode==='menu')return;if(mode==='crashed'){deathDelay-=dt;updateParticles(dt);if(deathDelay<=0)showResults();return}if(mode!=='playing')return;elapsed+=dt;speed=Math.min(185,78+score*.013);world+=speed*dt;score=world/10;jumpBuffer=Math.max(0,jumpBuffer-dt);if(player.grounded&&jumpBuffer>0)doJump();const ground=terrain(world+player.x);if(!player.grounded){player.air+=dt;
const holding=player.holdActive&&jumpInputs.size>0&&player.vy<0&&player.holdTime<JUMP.maxHold;
if(holding)player.holdTime+=dt;
else player.holdActive=false;
player.vy+=(holding?JUMP.heldGravity:JUMP.gravity)*dt;player.y+=player.vy*dt;if(player.y>=ground&&player.vy>=0){player.y=ground;player.vy=0;player.grounded=true;player.holdActive=false;player.air=0;player.angle=0;for(let i=0;i<5;i++)particles.push({x:world+player.x,y:ground,vx:-30-Math.random()*40,vy:-Math.random()*20,life:.35,color:'#f4f5ed'})}}else player.y=ground;player.angle=player.grounded?Math.atan(slope(world+player.x)):(player.air>.15?Math.min(1,(player.air-.15)/.65)*Math.PI*2:0);while(spawnAt<world+600)spawnGroup();for(const e of entities){if(e.type==='rider')e.x+=22*dt;const dx=e.x-world-player.x,ey=terrain(e.x);if(e.type==='coin'){if(!e.taken&&Math.abs(dx)<13&&Math.abs(ey-e.height-(player.y-12))<17){e.taken=true;runCoins++;sfx('coin');for(let i=0;i<4;i++)particles.push({x:e.x,y:ey-e.height,vx:(Math.random()-.5)*45,vy:-25-Math.random()*30,life:.3,color:'#ffda8b'})}}else if(e.type==='ramp'){if(!e.used&&dx<4&&dx>-9&&player.grounded){e.used=true;doJump(1.2)}}else if(Math.abs(dx)<(e.type==='log'?16:13)&&player.y>ey-(e.type==='rider'?24:e.type==='rock'?15:9)&&player.y-22<ey){endRun();break}}entities=entities.filter(e=>e.x>world-40&&!e.taken);updateParticles(dt);$('score').textContent=fmt(score);$('run-coins').textContent=fmt(runCoins);$('speed').textContent=(speed/78).toFixed(1)+'×';}
function updateParticles(dt){for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=130*dt;p.life-=dt}particles=particles.filter(p=>p.life>0)}
function render(){const menu=mode==='menu';drawBackground(ambient,menu);if(!menu){drawTerrain();for(const e of entities)if(e.x-world>-30&&e.x-world<510)drawEntity(e);rect(ctx,player.x-9,terrain(world+player.x)+2,19,2,'#668fa766');drawRider(ctx,player.x,player.y,currentRider(),currentGear(),mode==='crashed'||mode==='gameover'?1.3:player.angle,0);for(const p of particles)rect(ctx,p.x-world,p.y,2,2,p.color);if(player.grounded&&mode==='playing'){for(let i=0;i<5;i++)rect(ctx,player.x-14-i*5,player.y+(i%2),2,1,'#f4f7ee')}}for(let i=0;i<24;i++){const x=((i*71-ambient*(7+i%5))%500+500)%500,y=(i*43+ambient*(3+i%4))%270;rect(ctx,x,y,1,i%4===0?2:1,'#f6eee877')}}
// Fixed simulation steps keep collisions consistent across fast and slow displays.
let last=performance.now(),accumulator=0;function frame(now){const dt=Math.min(.1,(now-last)/1000);last=now;accumulator+=dt;while(accumulator>=1/120){update(1/120);accumulator-=1/120}render();requestAnimationFrame(frame)}
document.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click',closeModal));$('play').onclick=()=>{unlockAudio();save.ready?startRun():openModal('onboarding')};$('open-settings').onclick=()=>openModal('settings');$('open-shop').onclick=()=>{unlockAudio();if(!save.ready){openModal('onboarding');toast('selectFirst')}else openModal('shop')};$('quick-lang').onclick=()=>openModal('settings');$('sound-toggle').onclick=()=>{unlockAudio();if(save.volume){previousVolume=save.volume;setVolume(0)}else setVolume(previousVolume||.5)};$('language').onchange=e=>{save.lang=e.target.value;persist();translate()};$('volume').oninput=e=>{unlockAudio();setVolume(Number(e.target.value)/100)};
document.querySelectorAll('[data-gender]').forEach(b=>b.onclick=()=>{choiceGender=b.dataset.gender;document.querySelectorAll('[data-gender]').forEach(e=>e.setAttribute('aria-pressed',String(e===b)))});document.querySelectorAll('[data-gear]').forEach(b=>b.onclick=()=>{choiceGear=b.dataset.gear;document.querySelectorAll('[data-gear]').forEach(e=>e.setAttribute('aria-pressed',String(e===b)))});
$('start-adventure').onclick=()=>{if(!save.ready){save.rider=choiceGender;save.gear=choiceGear+'-classic';save.ownedRiders=[save.rider];save.ownedGear=[save.gear];save.ready=true;persist()}startRun()};document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{shopTab=b.dataset.tab;renderShop()});$('retry').onclick=startRun;$('return-menu').onclick=goMenu;$('pause-menu').onclick=goMenu;$('pause').onclick=pauseRun;$('resume').onclick=resumeRun;for(const target of [$('scene'),$('jump')]){
  target.addEventListener('pointerdown',e=>{
    if(mode!=='playing'||e.button!==0)return;
    e.preventDefault();
    target.setPointerCapture(e.pointerId);
    beginJumpInput('pointer:'+e.pointerId);
  });
  target.addEventListener('lostpointercapture',e=>endJumpInput('pointer:'+e.pointerId));
  target.addEventListener('contextmenu',e=>e.preventDefault());
}
document.addEventListener('pointerup',e=>endJumpInput('pointer:'+e.pointerId));
document.addEventListener('pointercancel',e=>endJumpInput('pointer:'+e.pointerId));
document.addEventListener('keyup',e=>{
  if(e.code==='Space'||e.code==='ArrowUp')endJumpInput('key:'+e.code);
});
document.addEventListener('keydown',e=>{const input=/INPUT|SELECT|TEXTAREA/.test(e.target.tagName);if(modal&&e.key==='Tab'){const f=[...$(modal).querySelectorAll('button:not(:disabled),input,select,[tabindex="0"]')].filter(el=>!el.hidden);if(f.length&&e.shiftKey&&document.activeElement===f[0]){e.preventDefault();f.at(-1).focus()}else if(f.length&&!e.shiftKey&&document.activeElement===f.at(-1)){e.preventDefault();f[0].focus()}return}if(input)return;if((e.code==='Space'||e.code==='ArrowUp')&&mode==='playing'){e.preventDefault();if(!e.repeat)beginJumpInput('key:'+e.code)}if(e.code==='KeyP'||e.code==='Escape'){if(mode==='playing'){e.preventDefault();pauseRun()}else if(mode==='paused'){e.preventDefault();resumeRun()}else if(modal&&mode==='menu')closeModal()}});
document.addEventListener('visibilitychange',()=>{if(document.hidden){pauseRun();if(audio)audio.suspend().catch(()=>{});if(mode==='crashed')showResults()}else{last=performance.now();accumulator=0;if(audio)audio.resume().catch(()=>{})}});window.addEventListener('blur',()=>{resetJumpInput();pauseRun()});window.addEventListener('pagehide',()=>{if(mode==='playing'||mode==='paused')saveRun()});
